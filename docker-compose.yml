version: '3.9'
services:
  relay:
    image: node:22
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sh -lc "corepack enable && pnpm install && pnpm --filter @pitwall/relay dev"
    ports:
      - "7071:7071"

  pitwall:
    image: node:22
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sh -lc "corepack enable && pnpm install && pnpm --filter @pitwall/pitwall dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - relay
